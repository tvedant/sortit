<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RefundWaapsi — Staff Login</title>
<style>
:root{--ink:#181613;--paper:#f7f2e8;--red:#c1272d;--blue:#2457a6;--muted:#6c6459}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(440px,100%);background:#fff;border:3px solid var(--ink);box-shadow:10px 10px 0 var(--red);padding:34px}.brand{font-weight:900;letter-spacing:.04em;font-size:22px}.sub{color:var(--muted);line-height:1.55;margin:8px 0 26px}.label{display:block;font-size:12px;font-weight:800;text-transform:uppercase;margin:16px 0 6px}.input{width:100%;padding:13px;border:2px solid var(--ink);font:inherit}.input:focus{outline:none;box-shadow:4px 4px 0 var(--blue)}button{width:100%;margin-top:22px;padding:14px;border:3px solid var(--ink);background:var(--ink);color:#fff;font-weight:900;font-size:15px;cursor:pointer}.msg{min-height:22px;margin-top:14px;text-align:center;font-weight:700;font-size:13px}.error{color:var(--red)}a{color:var(--ink);font-weight:700;text-decoration:none;display:inline-block;margin-top:20px;font-size:13px}
</style></head><body><main class="card"><div class="brand">🥊 REFUNDWAAPSI / STAFF</div><p class="sub">Sign in as an administrator or support agent. Customer accounts use the normal customer login.</p><form id="form"><label class="label">Email / Admin username</label><input class="input" id="email" autocomplete="username" required><label class="label">Password</label><input class="input" id="password" type="password" autocomplete="current-password" required><button id="btn">Sign in to workspace</button><div class="msg" id="msg"></div></form><a href="/">← Back to RefundWaapsi</a></main>
<script>
(async()=>{try{const r=await fetch('/api/staff/me');if(r.ok)location.href='/admin';}catch(_){}})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btn'),m=document.getElementById('msg');b.disabled=true;b.textContent='Signing in…';m.textContent='';m.className='msg';try{const r=await fetch('/api/staff/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');location.href='/admin';}catch(err){m.textContent=err.message;m.className='msg error';b.disabled=false;b.textContent='Sign in to workspace';}});
</script></body></html>
